[workspace]
resolver = "2"
members = [
    "plugin-api",
    "plugins/byte_counter",
    "src-tauri"
]
exclude = ["vendor/glib-0.18.5-patched"]

# Tauri 2's Linux GTK3 stack requires glib 0.18, whose final crates.io
# release contains RUSTSEC-2024-0429. This vendored crate is the verified
# crates.io source with upstream fix ea720152 applied verbatim.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5-patched" }