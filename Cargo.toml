[workspace]
resolver = "2"
members = [
    "plugin-api",
    "plugins/byte_counter",
    "src-tauri"
]

# Tauri 2's Linux GTK3 stack requires glib 0.18, whose final crates.io
# release contains RUSTSEC-2024-0429. Pin HexHawk's checksum-verified copy
# with upstream fix ea720152 applied verbatim; e81fb5b is immutable custody.
[patch.crates-io]
glib = { git = "https://github.com/Zielmenosza/hexhawk", rev = "e81fb5b067d2e5236ca7bdf374ef96977e039050" }