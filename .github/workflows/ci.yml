name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── TypeScript Tests (engines — Node environment) ───────────────────────────
  test-ts-engines:
    name: TypeScript Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn workspace hexhawk-ui exec tsc --noEmit

      - name: Bounded filesystem regression tests
        run: node --test scripts/release/bounded-file.test.mjs scripts/release/locked-package.test.mjs

      - name: Run engine tests
        run: yarn workspace hexhawk-ui exec vitest run --reporter=verbose
        env:
          VITEST_ENV: node

      - name: Build challenge-derived STRIKE fixtures
        run: yarn workspace hexhawk-ui strike:fixtures

      - name: STRIKE benchmark drift gate
        run: yarn workspace hexhawk-ui strike:benchmark --stability-runs 3 --max-score-drop 5

      - name: Upload STRIKE benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: strike-benchmark-report
          path: |
            nest_tests/strike_benchmarks/latest.json
            nest_tests/strike_benchmarks/latest.md
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-engines
          path: HexHawk/coverage/
          if-no-files-found: warn

  # ── TypeScript Tests (components — jsdom environment) ────────────────────────
  test-ts-components:
    name: TypeScript Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run component tests
        run: yarn workspace hexhawk-ui exec vitest run --reporter=verbose src/components/__tests__

  # ── TypeScript Tests (legacy alias kept for existing status checks) ──────────
  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: [test-ts-engines, test-ts-components]
    steps:
      - name: All TypeScript tests passed
        run: echo "All TS test jobs complete"

  # ── Rust Tests ──────────────────────────────────────────────────────────────
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Run Rust tests
        run: cargo test --workspace

  # ── Tauri Build (Windows installer) ────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [test-ts, test-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Windows packaging contract
        run: python scripts/release/test_windows_packaging_contract.py

      - name: Cache all locked crate sources for offline bundle metadata
        # The checksum hook inspects Cargo's all-target graph, not only crates
        # compiled for this runner. Populate that cache without changing locks.
        run: cargo fetch --locked

      - name: Build Tauri app (Windows x64 NSIS only)
        run: yarn tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: hexhawk-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ── Tauri Build (macOS DMG) ─────────────────────────────────────────────────
  build-macos:
    name: macOS packaging (excluded from bounded Windows scope)
    # The current bundle configuration and loader custody hook are Windows-only.
    # Retain the planned steps, but do not claim excluded-platform artifacts.
    if: ${{ false }}
    runs-on: macos-latest
    needs: [test-ts, test-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Tauri app (macOS unsigned CI artifact)
        # Do not inject signing/notarization credentials into the routine CI gate.
        # Signed/notarized artifacts belong to the explicit release gate only.
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          yarn tauri:build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hexhawk-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Tauri Build (Linux AppImage) ────────────────────────────────────────────
  build-linux:
    name: Linux packaging (excluded from bounded Windows scope)
    # Linux source tests remain enabled above; package qualification is excluded.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: [test-ts, test-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Tauri app (Linux)
        run: yarn tauri:build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hexhawk-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
